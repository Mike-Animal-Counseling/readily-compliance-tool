name: Application security and build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      evidence-postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: readily_v1_test
          POSTGRES_USER: readily_test
          POSTGRES_PASSWORD: readily_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U readily_test -d readily_v1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install . locked dependencies
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Audit . dependencies
        working-directory: .
        run: npm audit --audit-level=low
      - name: Authentication and security regressions
        working-directory: .
        run: npm test
      - name: Lint
        working-directory: .
        run: npm run lint
      - name: Check types with TypeScript 7
        run: npm run typecheck
      - name: Build production assets
        working-directory: .
        run: npm run build
      - name: Real HTTP login and isolated PDF upload
        run: npm run test:http
      - name: Built application, TLS services and independent holdout
        run: bash scripts/evidence-runtime-fixtures.sh
        env:
          EVIDENCE_POSTGRES_CONTAINER: ${{ job.services.evidence-postgres.id }}
          EVIDENCE_POSTGRES_PORT: ${{ job.services.evidence-postgres.ports[5432] }}
